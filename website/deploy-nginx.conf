# GameWall 官网 · Nginx 配置片段
#
# 用法：宝塔面板 → 网站 → game.jichun29.cn → 设置 → 配置文件，
# 把下面 server { ... } 内部的内容合并进去（不是整段替换）。
# 如果你的站点已经能正常访问 index.html，最少只需要加「静态资源缓存」那一段。

server {
    listen 80;
    listen 443 ssl http2;
    server_name game.jichun29.cn;

    # 站点根目录指向 website 文件夹（把 website 里的文件直接传到这个目录下）
    root /www/wwwroot/game.jichun29.cn;
    index index.html;

    charset utf-8;

    # ── 压缩：CSS/JS 未压缩约 64KB，开 gzip 后约 14KB ──
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ── 静态资源长缓存：文件名带内容语义的可以放心缓存一年 ──
    # 截图和 logo 基本不会改，改了要记得改名或清缓存
    location ~* \.(png|jpg|jpeg|webp|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~* \.(css|js)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # index.html 不缓存，保证改完文案用户刷新就能看到
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # ── 安全响应头 ──
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── 404 直接回首页，避免用户看到宝塔默认页 ──
    error_page 404 /index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
